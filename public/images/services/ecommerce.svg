<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecommerceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ecommerceBg)"/>

  <pattern id="ecommerceGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#ecommerceGrid)"/>

  <!-- Shopping Cart -->
  <g transform="translate(300, 200)">
    <!-- Cart Body -->
    <path d="M 0 0 L 20 0 L 30 80 L 120 80 L 130 30 L 40 30"
          stroke="rgba(255,255,255,0.9)" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <!-- Cart Grid -->
    <line x1="40" y1="40" x2="120" y2="40" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <line x1="40" y1="55" x2="115" y2="55" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <line x1="40" y1="70" x2="110" y2="70" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
    <!-- Wheels -->
    <circle cx="50" cy="100" r="12" fill="rgba(255,255,255,0.9)"/>
    <circle cx="100" cy="100" r="12" fill="rgba(255,255,255,0.9)"/>
    <circle cx="50" cy="100" r="6" fill="#EF4444"/>
    <circle cx="100" cy="100" r="6" fill="#EF4444"/>
  </g>

  <!-- Product Cards -->
  <g transform="translate(150, 350)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="rgba(255,255,255,0.85)"/>
    <rect x="10" y="10" width="100" height="80" rx="5" fill="#EF4444" opacity="0.2"/>
    <rect x="10" y="100" width="80" height="10" rx="3" fill="#EF4444" opacity="0.4"/>
    <rect x="10" y="120" width="60" height="10" rx="3" fill="#EF4444" opacity="0.3"/>
    <circle cx="90" cy="130" r="12" fill="#EF4444"/>
    <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+</text>
  </g>

  <g transform="translate(300, 350)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="rgba(255,255,255,0.85)"/>
    <rect x="10" y="10" width="100" height="80" rx="5" fill="#EF4444" opacity="0.2"/>
    <rect x="10" y="100" width="80" height="10" rx="3" fill="#EF4444" opacity="0.4"/>
    <rect x="10" y="120" width="60" height="10" rx="3" fill="#EF4444" opacity="0.3"/>
    <circle cx="90" cy="130" r="12" fill="#EF4444"/>
    <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+</text>
  </g>

  <g transform="translate(450, 350)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="rgba(255,255,255,0.85)"/>
    <rect x="10" y="10" width="100" height="80" rx="5" fill="#EF4444" opacity="0.2"/>
    <rect x="10" y="100" width="80" height="10" rx="3" fill="#EF4444" opacity="0.4"/>
    <rect x="10" y="120" width="60" height="10" rx="3" fill="#EF4444" opacity="0.3"/>
    <circle cx="90" cy="130" r="12" fill="#EF4444"/>
    <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+</text>
  </g>

  <!-- Globe/International Icon -->
  <g transform="translate(550, 180)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="20" ry="50" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  </g>

  <!-- Price Tag -->
  <g transform="translate(120, 180)">
    <path d="M 0 20 L 40 0 L 80 20 L 80 60 L 40 80 L 0 60 Z" fill="rgba(255,255,255,0.85)"/>
    <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#EF4444">$</text>
  </g>

  <!-- Delivery Truck -->
  <g transform="translate(600, 400)" opacity="0.8">
    <rect x="0" y="0" width="60" height="35" rx="3" fill="rgba(255,255,255,0.9)"/>
    <rect x="60" y="10" width="30" height="25" rx="3" fill="rgba(255,255,255,0.9)"/>
    <circle cx="20" cy="40" r="8" fill="#EF4444"/>
    <circle cx="70" cy="40" r="8" fill="#EF4444"/>
    <rect x="10" y="8" width="15" height="12" rx="2" fill="#EF4444" opacity="0.4"/>
    <rect x="30" y="8" width="15" height="12" rx="2" fill="#EF4444" opacity="0.4"/>

    <!-- Motion Lines -->
    <line x1="-10" y1="15" x2="-25" y2="15" stroke="rgba(255,255,255,0.6)" stroke-width="2">
      <animate attributeName="x1" values="-10;-30" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-25;-45" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="-10" y1="25" x2="-20" y2="25" stroke="rgba(255,255,255,0.6)" stroke-width="2">
      <animate attributeName="x1" values="-10;-30" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20;-40" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
