<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="integrationBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#integrationBg)"/>

  <pattern id="integrationGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#integrationGrid)"/>

  <!-- Central Hub -->
  <circle cx="400" cy="300" r="60" fill="rgba(255,255,255,0.9)"/>
  <circle cx="400" cy="300" r="45" fill="#F59E0B"/>
  <circle cx="400" cy="300" r="20" fill="rgba(255,255,255,0.9)"/>

  <!-- Connected Systems -->
  <!-- Database -->
  <g transform="translate(200, 150)">
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="rgba(255,255,255,0.8)"/>
    <rect x="-40" y="0" width="80" height="60" fill="rgba(255,255,255,0.8)"/>
    <ellipse cx="0" cy="60" rx="40" ry="15" fill="rgba(255,255,255,0.9)"/>
    <ellipse cx="0" cy="20" rx="40" ry="15" fill="rgba(255,255,255,0.6)"/>
    <ellipse cx="0" cy="40" rx="40" ry="15" fill="rgba(255,255,255,0.6)"/>
  </g>

  <!-- API -->
  <g transform="translate(600, 150)">
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="rgba(255,255,255,0.85)"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#F59E0B">API</text>
  </g>

  <!-- Cloud Service -->
  <g transform="translate(200, 450)">
    <ellipse cx="0" cy="-10" rx="30" ry="20" fill="rgba(255,255,255,0.85)"/>
    <ellipse cx="-20" cy="0" rx="25" ry="18" fill="rgba(255,255,255,0.85)"/>
    <ellipse cx="20" cy="0" rx="25" ry="18" fill="rgba(255,255,255,0.85)"/>
    <rect x="-35" y="0" width="70" height="20" fill="rgba(255,255,255,0.85)"/>
  </g>

  <!-- Server -->
  <g transform="translate(600, 450)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="rgba(255,255,255,0.85)"/>
    <rect x="-25" y="-20" width="50" height="8" rx="2" fill="#F59E0B"/>
    <rect x="-25" y="-5" width="50" height="8" rx="2" fill="#F59E0B"/>
    <rect x="-25" y="10" width="50" height="8" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Mobile App -->
  <g transform="translate(100, 300)">
    <rect x="-25" y="-40" width="50" height="80" rx="8" fill="rgba(255,255,255,0.85)"/>
    <rect x="-20" y="-32" width="40" height="55" rx="2" fill="#F59E0B" opacity="0.3"/>
    <circle cx="0" cy="30" r="6" fill="#F59E0B" opacity="0.5"/>
  </g>

  <!-- Web App -->
  <g transform="translate(700, 300)">
    <rect x="-35" y="-25" width="70" height="50" rx="3" fill="rgba(255,255,255,0.85)"/>
    <rect x="-35" y="-25" width="70" height="12" rx="3" fill="#F59E0B" opacity="0.5"/>
    <circle cx="-25" cy="-19" r="3" fill="#ffffff"/>
    <circle cx="-15" cy="-19" r="3" fill="#ffffff"/>
    <circle cx="-5" cy="-19" r="3" fill="#ffffff"/>
  </g>

  <!-- Connection Lines (Animated) -->
  <line x1="200" y1="210" x2="360" y2="270" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="600" y1="175" x2="440" y2="270" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="430" x2="360" y2="330" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="600" y1="430" x2="440" y2="330" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="125" y1="300" x2="340" y2="300" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="675" y1="300" x2="460" y2="300" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Data Flow Indicators -->
  <circle cx="280" cy="240" r="6" fill="#ffffff">
    <animate attributeName="cx" values="200;400" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;300" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="210" r="6" fill="#ffffff">
    <animate attributeName="cx" values="600;400" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="175;270" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
