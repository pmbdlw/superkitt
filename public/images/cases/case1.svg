<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="case1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#case1Bg)"/>

  <pattern id="case1Grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#case1Grid)"/>

  <!-- Success Metrics Dashboard -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="600" height="400" rx="10" fill="rgba(255,255,255,0.1)"/>

    <!-- Metric Cards -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="250" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" fill="#3B82F6" font-weight="bold">API Response Time</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="36" fill="#1E40AF" font-weight="bold">-75%</text>
      <polygon points="200,70 220,60 220,80" fill="#10B981"/>
    </g>

    <g transform="translate(320, 30)">
      <rect x="0" y="0" width="250" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" fill="#3B82F6" font-weight="bold">System Uptime</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="36" fill="#1E40AF" font-weight="bold">99.9%</text>
      <path d="M 180 60 L 190 50 L 210 70 L 230 45" stroke="#10B981" stroke-width="3" fill="none"/>
    </g>

    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="250" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" fill="#3B82F6" font-weight="bold">Cost Savings</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="36" fill="#1E40AF" font-weight="bold">$2.5M</text>
      <circle cx="210" cy="65" r="20" fill="#10B981" opacity="0.2"/>
      <text x="210" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#10B981">✓</text>
    </g>

    <g transform="translate(320, 160)">
      <rect x="0" y="0" width="250" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" fill="#3B82F6" font-weight="bold">User Satisfaction</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="36" fill="#1E40AF" font-weight="bold">95%</text>
      <!-- Star Rating -->
      <text x="180" y="75" font-family="Arial, sans-serif" font-size="28" fill="#F59E0B">★★★★★</text>
    </g>

    <!-- Progress Bar -->
    <g transform="translate(30, 290)">
      <rect x="0" y="0" width="540" height="30" rx="15" fill="rgba(255,255,255,0.3)"/>
      <rect x="0" y="0" width="470" height="30" rx="15" fill="rgba(255,255,255,0.9)"/>
      <text x="240" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3B82F6" font-weight="bold">Project Completion: 87%</text>
    </g>

    <!-- Timeline -->
    <g transform="translate(30, 350)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#10B981"/>
      <circle cx="180" cy="0" r="8" fill="#10B981"/>
      <circle cx="360" cy="0" r="8" fill="#10B981"/>
      <circle cx="540" cy="0" r="8" fill="#3B82F6"/>
    </g>
  </g>

  <!-- Floating Success Icons -->
  <g opacity="0.3">
    <circle cx="50" cy="150" r="30" fill="rgba(255,255,255,0.5)">
      <animate attributeName="cy" values="150;130;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="50" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#fff">✓</text>

    <circle cx="750" cy="250" r="25" fill="rgba(255,255,255,0.4)">
      <animate attributeName="cy" values="250;235;250" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text x="750" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#fff">↗</text>
  </g>
</svg>
