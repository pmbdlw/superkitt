<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="case2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#case2Bg)"/>

  <pattern id="case2Grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#case2Grid)"/>

  <!-- Global Expansion Map -->
  <g transform="translate(150, 120)">
    <!-- World Map Simplified -->
    <rect x="0" y="0" width="500" height="300" rx="10" fill="rgba(255,255,255,0.1)"/>

    <!-- Continents (Simplified) -->
    <g opacity="0.3">
      <!-- Asia -->
      <ellipse cx="350" cy="120" rx="80" ry="60" fill="rgba(255,255,255,0.5)"/>
      <!-- Europe -->
      <ellipse cx="230" cy="100" rx="40" ry="50" fill="rgba(255,255,255,0.5)"/>
      <!-- North America -->
      <ellipse cx="120" cy="100" rx="60" ry="70" fill="rgba(255,255,255,0.5)"/>
      <!-- South America -->
      <ellipse cx="140" cy="200" rx="35" ry="60" fill="rgba(255,255,255,0.5)"/>
      <!-- Africa -->
      <ellipse cx="250" cy="180" rx="50" ry="70" fill="rgba(255,255,255,0.5)"/>
    </g>

    <!-- Location Pins with Pulse -->
    <g>
      <!-- Pin 1 - Asia -->
      <circle cx="350" cy="120" r="8" fill="#10B981"/>
      <circle cx="350" cy="120" r="15" fill="none" stroke="#10B981" stroke-width="2">
        <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Pin 2 - Europe -->
      <circle cx="230" cy="100" r="8" fill="#10B981"/>
      <circle cx="230" cy="100" r="15" fill="none" stroke="#10B981" stroke-width="2">
        <animate attributeName="r" values="15;25;15" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Pin 3 - North America -->
      <circle cx="120" cy="100" r="8" fill="#10B981"/>
      <circle cx="120" cy="100" r="15" fill="none" stroke="#10B981" stroke-width="2">
        <animate attributeName="r" values="15;25;15" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>

      <!-- Pin 4 - South America -->
      <circle cx="140" cy="200" r="8" fill="#10B981"/>
      <circle cx="140" cy="200" r="15" fill="none" stroke="#10B981" stroke-width="2">
        <animate attributeName="r" values="15;25;15" dur="2s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Connection Lines -->
    <g opacity="0.4">
      <line x1="350" y1="120" x2="230" y2="100" stroke="#fff" stroke-width="2" stroke-dasharray="5,5">
        <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="230" y1="100" x2="120" y2="100" stroke="#fff" stroke-width="2" stroke-dasharray="5,5">
        <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="120" y1="100" x2="140" y2="200" stroke="#fff" stroke-width="2" stroke-dasharray="5,5">
        <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Statistics Cards -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
    <text x="75" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#8B5CF6" font-weight="bold">15</text>
    <text x="75" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Countries</text>
    <text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Launched</text>
  </g>

  <g transform="translate(230, 450)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
    <text x="75" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#8B5CF6" font-weight="bold">2M+</text>
    <text x="75" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Global</text>
    <text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Users</text>
  </g>

  <g transform="translate(410, 450)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
    <text x="75" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#8B5CF6" font-weight="bold">300%</text>
    <text x="75" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Revenue</text>
    <text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Growth</text>
  </g>

  <g transform="translate(590, 450)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="rgba(255,255,255,0.9)"/>
    <text x="75" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#8B5CF6" font-weight="bold">6mo</text>
    <text x="75" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Time to</text>
    <text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6D28D9">Market</text>
  </g>

  <!-- Airplane Icon -->
  <g transform="translate(650, 80)" opacity="0.4">
    <path d="M 0 0 L 40 -10 L 40 -5 L 15 0 L 40 5 L 40 10 Z" fill="rgba(255,255,255,0.8)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 60,0; 0,0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Growth Arrow -->
  <g transform="translate(70, 100)" opacity="0.5">
    <polyline points="0,80 20,60 40,70 60,40 80,50 100,20" stroke="rgba(255,255,255,0.8)" stroke-width="4" fill="none"/>
    <polygon points="95,15 105,20 100,30" fill="rgba(255,255,255,0.8)"/>
  </g>
</svg>
